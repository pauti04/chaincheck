[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chaincheck"
version = "0.6.0"
description = "LLM hallucination detection toolkit — claim-level verification via NLI, self-consistency, and LLM-as-judge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Parth Auti", email = "parth.auti@gmail.com" }]
requires-python = ">=3.11"
keywords = ["llm", "hallucination", "detection", "nlp", "rag", "factuality"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "sentence-transformers>=3.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "typer[all]>=0.12.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "diskcache>=5.6.0",
    "slowapi>=0.1.9",
    "datasets>=3.2.0",
    "numpy>=1.26.0",
    "torch>=2.4.0",
    "sqlalchemy>=2.0.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/pauti04/chaincheck"
Repository = "https://github.com/pauti04/chaincheck"
Documentation = "https://github.com/pauti04/chaincheck#readme"

[project.scripts]
chaincheck = "chaincheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["chaincheck"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # do not perform function calls in default argument values
    "SIM108", # ternary operator — less readable in complex cases
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=chaincheck --cov-report=term-missing"
filterwarnings = [
    "ignore::RuntimeWarning:.*coroutine.*never awaited.*",
    "ignore:coroutine.*never awaited:RuntimeWarning",
]

[tool.coverage.run]
omit = ["tests/*", "scripts/*"]
