name: Weekly Eval

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run evals
        run: |
          uv run chaincheck eval --method nli --samples 500 --output eval_results_nli.json
          uv run chaincheck eval --method consistency --samples 500 --output eval_results_consistency.json
          uv run chaincheck eval --method judge --samples 500 --output eval_results_judge.json
      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update benchmark results"
          file_pattern: "eval_results*.json"
