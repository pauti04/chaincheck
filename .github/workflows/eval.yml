name: Benchmark Eval

# Manual dispatch only. A weekly cron used to re-commit fresh eval JSONs, but
# gpt-4o-mini run-to-run variance silently desynced them from the numbers
# quoted in the README. Run deliberately, then update the README tables in the
# same change.
on:
  workflow_dispatch:

jobs:
  run-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Run benchmark (500 samples per method)
        run: bash scripts/run_eval.sh
        env:
          SAMPLES: 500
          OUTPUT: eval_results.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit updated eval results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *eval_results*.json
          git diff --staged --quiet || git commit -m "chore: update benchmark results [skip ci]"
          git push
