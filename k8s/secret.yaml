# ⚠️  DO NOT commit real secrets — use Sealed Secrets, External Secrets Operator,
#     or a Vault CSI driver in production.
#
# Populate values with:
#   kubectl create secret generic chaincheck-secrets \
#     --namespace chaincheck \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#     --from-literal=CHAINCHECK_API_KEY='your-api-key' \
#     --from-literal=DATABASE_URL='postgresql://chaincheck:password@chaincheck-postgres:5432/chaincheck'
#
# Template (base64-encoded placeholders):
apiVersion: v1
kind: Secret
metadata:
  name: chaincheck-secrets
  namespace: chaincheck
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  ANTHROPIC_API_KEY: "REPLACE_ME"
  CHAINCHECK_API_KEY: "REPLACE_ME"
  DATABASE_URL: "postgresql://chaincheck:REPLACE_ME@chaincheck-postgres:5432/chaincheck"
  POSTGRES_PASSWORD: "REPLACE_ME"
