apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chaincheck-api-hpa
  namespace: chaincheck
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chaincheck-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # scale out when avg CPU > 60%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70   # scale out when avg memory > 70%
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30    # react fast to traffic spikes
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
