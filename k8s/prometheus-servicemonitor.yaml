# ServiceMonitor for Prometheus Operator (kube-prometheus-stack)
# Tells Prometheus to scrape /metrics from both the API pods and the model server.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chaincheck-api
  namespace: chaincheck
  labels:
    release: kube-prometheus-stack   # match your Prometheus Operator release label
spec:
  selector:
    matchLabels:
      app: chaincheck-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chaincheck-model-server
  namespace: chaincheck
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: chaincheck-model-server
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
