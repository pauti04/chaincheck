apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chaincheck-postgres
  namespace: chaincheck
  labels:
    app: chaincheck-postgres
spec:
  serviceName: chaincheck-postgres
  replicas: 1
  selector:
    matchLabels:
      app: chaincheck-postgres
  template:
    metadata:
      labels:
        app: chaincheck-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: chaincheck
            - name: POSTGRES_USER
              value: chaincheck
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chaincheck-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "chaincheck"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "chaincheck"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chaincheck-postgres
  namespace: chaincheck
  labels:
    app: chaincheck-postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: chaincheck-postgres
