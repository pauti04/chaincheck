apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chaincheck-ingress
  namespace: chaincheck
  annotations:
    # nginx-ingress controller annotations
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Enable WebSocket/SSE for the /stream endpoint
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    # TLS — cert-manager will provision the certificate automatically
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Rate limiting at the ingress level (belt-and-suspenders with slowapi)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.chaincheck.io        # ← replace with your domain
      secretName: chaincheck-tls
  rules:
    - host: api.chaincheck.io      # ← replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chaincheck-api
                port:
                  name: http
