apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaincheck-api
  namespace: chaincheck
  labels:
    app: chaincheck-api
    component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: chaincheck-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: chaincheck-api
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/pauti04/chaincheck:latest
          command:
            - uvicorn
            - chaincheck.server:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --workers
            - "1"      # 1 worker per pod; scale with replicas + HPA
            - --loop
            - uvloop
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: chaincheck-config
            - secretRef:
                name: chaincheck-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Give in-flight requests time to drain before pod shutdown
                command: ["/bin/sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: chaincheck-api
  namespace: chaincheck
  labels:
    app: chaincheck-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app: chaincheck-api
